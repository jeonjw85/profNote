[package]
name = "profnote"
version = "0.3.6"
description = "Lecture recorder and markdown note editor"
authors = ["jjw"]
edition = "2024"

[lib]
name = "profnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.20"
cpal = "0.18.1"
hound = "3.5.1"
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
ureq = { version = "3.4.0", features = ["rustls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Capture",
    "Devices_Enumeration",
    "Win32_System_Com",
] }
